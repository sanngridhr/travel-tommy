[project]
name = "travel-tommy"
version = "0.1.0"
description = "CRUD applications to help travelers"
authors = [
    {name = "Orest Ivanko",email = "orest58008@yamadachi.quest"}
]
license = "Beerware"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.128.2,<0.129.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pydantic (>=2.12.5,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
exclude = ["migrations"]

indent-width = 4
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "Q", "B"]